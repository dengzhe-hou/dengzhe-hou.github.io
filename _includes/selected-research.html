{% include base_path %}
<ul class="pub-list pub-list--thumbs">
  {% for project in page.selected_research %}
  <li class="pub">
    <a class="pub__thumb" href="{{ base_path }}/images/{{ project.image_path }}" aria-label="View full-size figure for {{ project.title | escape }}">
      <img src="{{ base_path }}/images/{{ project.image_path }}" alt="{{ project.alt | escape }}" width="880" height="495" loading="lazy">
    </a>
    <div class="pub__body">
      <p class="pub__title"><a href="{{ base_path }}{{ project.url }}">{{ project.title }}</a></p>
      <div class="pub__excerpt">{{ project.excerpt | markdownify }}</div>
      <p class="pub__links"><a class="pub-link" href="{{ base_path }}{{ project.url }}">{{ project.btn_label | downcase }}</a> <a class="pub-link" href="{{ base_path }}/images/{{ project.image_path }}">figure</a></p>
    </div>
  </li>
  {% endfor %}
</ul>
