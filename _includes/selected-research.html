{% include base_path %}
<div class="research-grid">
  {% for project in page.selected_research %}
  <article class="research-card">
    <a class="research-card__figure" href="{{ base_path }}/images/{{ project.image_path }}" aria-label="View full-size figure for {{ project.title | escape }}">
      <img src="{{ base_path }}/images/{{ project.image_path }}" alt="{{ project.alt | escape }}" width="880" height="495">
      <span>View figure</span>
    </a>
    <div class="research-card__body">
      <h3><a href="{{ base_path }}{{ project.url }}">{{ project.title }}</a></h3>
      {{ project.excerpt | markdownify }}
      <a class="btn btn--primary research-card__link" href="{{ base_path }}{{ project.url }}">{{ project.btn_label }}</a>
    </div>
  </article>
  {% endfor %}
</div>
