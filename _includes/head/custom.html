<!-- Site style: a quiet single-column academic page after the David Lindell
     reference in Look et al. (looketal.com): white page, 900px column, serif
     prose, sans labels, one blue accent, hairline separators, no shadows. -->
<style>
  :root {
    color-scheme: light;
    --text: #000000;
    --secondary: #555555;
    --accent: #0076df;
    --award: #cc0000;
    --icon: #424242;
    --rule: #e8e8e8;
    --row-rule: #f0f0f0;
    --button-edge: #cccccc;
    --footer: #828282;
    --serif: 'Source Serif 4', 'Noto Serif JP', 'Hiragino Mincho ProN', 'Yu Mincho', Georgia, serif;
    --sans: 'Source Sans 3', 'Hiragino Sans', 'Yu Gothic UI', 'Yu Gothic', 'Helvetica Neue', Arial, sans-serif;

    /* Theme variables used by the AcademicPages stylesheet */
    --global-base-color: var(--accent);
    --global-bg-color: #ffffff;
    --global-footer-bg-color: #ffffff;
    --global-border-color: var(--rule);
    --global-dark-border-color: var(--rule);
    --global-link-color: var(--accent);
    --global-link-color-hover: var(--accent);
    --global-link-color-visited: var(--accent);
    --global-masthead-link-color: var(--text);
    --global-masthead-link-color-hover: var(--accent);
    --global-text-color: var(--text);
    --global-text-color-light: var(--secondary);
    --global-thead-color: #ffffff;
  }

  html { font-size: 16px; background: #ffffff; }
  body {
    padding-top: 0 !important;
    background: #ffffff;
    color: var(--text);
    font: 400 1rem/1.65 var(--serif);
  }

  /* ── Links ─────────────────────────────── */
  a, a:visited { color: var(--accent); text-decoration: none; }
  a:hover, a:focus-visible { color: var(--accent); text-decoration: underline; }
  .page__content a, .archive a { text-decoration: none; }
  .page__content a:hover, .archive a:hover { text-decoration: underline; }
  .archive a:hover img { box-shadow: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ── One 900px column ──────────────────── */
  #main, .site-header__inner, .page__footer footer {
    max-width: 900px;
    margin-left: auto;
    margin-right: auto;
    padding-left: 15px;
    padding-right: 15px;
  }
  #main { margin-top: 32px; animation: none; }
  .page, .archive {
    float: none !important;
    width: auto !important;
    margin: 0 !important;
    padding: 0 !important;
  }
  .page__content > p, .page__content > ul, .page__content > ol,
  .archive > p, .archive > ul, .archive > ol { max-width: none; }

  /* ── Header ────────────────────────────── */
  .site-header {
    padding: 24px 0 16px;
    border-bottom: 1px solid var(--rule);
    font-family: var(--sans);
  }
  .site-header__inner {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 8px 24px;
  }
  .site-title, .site-title:visited {
    margin-right: auto;
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--text);
  }
  .site-title:hover { color: var(--text); text-decoration: none; }
  .site-nav { display: flex; flex-wrap: wrap; gap: 4px 20px; }
  .site-nav a, .site-nav a:visited {
    font-size: 0.95rem;
    color: var(--text);
    text-transform: lowercase;
  }
  .site-nav a:hover { color: var(--accent); text-decoration: none; }
  .site-nav a.is-active { color: var(--accent); font-weight: 600; }

  /* ── Headings ──────────────────────────── */
  h1, h2, h3, h4, h5, h6, .page__title, .archive__item-title {
    font-family: var(--sans);
    color: var(--text);
  }
  .page__title {
    margin: 0 0 16px;
    font-size: 1.75rem;
    font-weight: 700;
    line-height: 1.2;
  }
  .page__content h2, .archive h2 {
    margin: 32px 0 12px;
    padding: 0;
    border: 0;
    font-size: 1.35rem;
    font-weight: 600;
    line-height: 1.2;
    text-transform: lowercase;
  }
  /* Headings written inside a paper, talk or course page keep their case */
  .page__content--item h2 { text-transform: none; }
  .page__content h3 { font-size: 1.05rem; font-weight: 600; line-height: 1.35; }
  .page__content p, .page__content li, .archive p, .archive li { font-size: 1rem; line-height: 1.65; }
  .page__content > p, .archive > p { margin: 0 0 16px; }
  .page__content ul, .archive ul { padding-left: 1.25rem; }
  .page__content li { margin-bottom: 4px; }

  /* ── Homepage profile ──────────────────── */
  .profile { display: flex; align-items: flex-start; gap: 24px; margin-bottom: 24px; }
  .profile__photo {
    flex: none;
    width: 200px;
    height: 200px;
    object-fit: cover;
    border-radius: 8px;
  }
  .profile__name { margin: 0 0 4px; font-size: 1.75rem; font-weight: 700; line-height: 1.2; }
  .profile__name span { font-weight: 600; }
  .profile__desc { margin: 0 0 11px; font-size: 0.875rem; line-height: 1.65; color: var(--secondary); }
  .profile__icons { display: flex; flex-wrap: wrap; gap: 8px 12px; margin: 0; padding: 0; list-style: none; }
  .profile__icons li { margin: 0; font-size: 24px; line-height: 1; }
  .profile__icons a, .profile__icons a:visited { color: var(--icon); }
  .profile__icons a:hover { color: var(--accent); text-decoration: none; }
  .profile-intro > p { margin: 0 0 16px; }

  /* ── Disclosure toggles ("Earlier news", background) ── */
  details > summary {
    width: fit-content;
    cursor: pointer;
    font-size: 0.875rem;
    color: var(--accent);
    list-style-position: inside;
  }
  details > summary:hover { text-decoration: underline; }
  details[open] > summary { margin-bottom: 12px; }
  .profile-background { margin: 0 0 24px; }
  .news-archive { margin-top: 8px; }

  /* ── Dated row lists: news, grants (tables with no header row) ── */
  .page__content table { font-family: var(--serif); }
  .page__content table:not(:has(thead)) {
    display: table;
    width: 100%;
    margin: 0 0 8px;
    border: 0;
    border-collapse: collapse;
    font-size: 0.875rem;
    overflow: visible;
  }
  .page__content table:not(:has(thead)) tr { background: transparent !important; }
  .page__content table:not(:has(thead)) td {
    padding: 6.4px 16px 6.4px 0;
    border: 0;
    border-bottom: 1px solid var(--row-rule);
    background: transparent !important;
    font-size: 0.875rem;
    line-height: 1.5;
    vertical-align: baseline;
  }
  .page__content table:not(:has(thead)) td:last-child { padding-right: 0; }
  .page__content table:not(:has(thead)) td:first-child {
    width: 1%;
    min-width: 80px;
    white-space: nowrap;
    font-family: var(--sans);
    font-size: 0.8rem;
  }
  .page__content table:not(:has(thead)) td:first-child,
  .page__content table:not(:has(thead)) td:first-child strong {
    font-weight: 600;
    color: var(--accent);
  }
  /* Tables with a real header row (teaching detail pages) */
  .page__content table:has(thead) { border: 0; font-size: 0.875rem; }
  .page__content table:has(thead) th {
    font-family: var(--sans);
    font-weight: 600;
    text-align: left;
    border: 0;
    border-bottom: 1px solid var(--rule);
    background: #ffffff;
  }
  .page__content table:has(thead) td { border: 0; border-bottom: 1px solid var(--row-rule); }

  /* ── Publication rows (selected research, publications page) ── */
  .page__content .pub-list { margin: 0; padding: 0; list-style: none; }
  .pub-list > li.pub { margin: 0; }
  .pub {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 12px 0;
    border-bottom: 1px solid var(--row-rule);
  }
  .page__content .pub__thumb, .page__content .pub__thumb:hover { flex: none; border: 0; text-decoration: none; }
  .pub__thumb img {
    display: block;
    width: 176px;
    height: 99px;
    object-fit: cover;
    border-radius: 4px;
    background: #f5f5f5;
  }
  /* Figure strip that pans inside the thumbnail while the row is hovered */
  .page__content .pub__thumb { position: relative; display: block; overflow: hidden; border-radius: 4px; }
  .pub__thumb img.pub__strip { position: absolute; top: 0; left: 0; width: 100%; height: auto; object-fit: initial; border-radius: 0; opacity: 0; background: #ffffff; transition: opacity .25s; pointer-events: none; }
  @media (hover: hover) and (prefers-reduced-motion: no-preference) {
    .pub:hover .pub__strip.ready, .pub:focus-within .pub__strip.ready {
      opacity: 1;
      animation: strip-pan var(--dur) ease-in-out .25s infinite alternate;
    }
  }
  @keyframes strip-pan { 0%, 6% { transform: translateY(0); } 94%, 100% { transform: translateY(var(--end)); } }
  .pub__body { min-width: 0; }
  .page__content .pub__title, .archive .pub__title {
    margin: 0 0 2px;
    font-family: var(--serif);
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.4;
  }
  .pub__title a, .pub__title a:visited { color: var(--accent); }
  .page__content .pub__excerpt p, .page__content .pub__excerpt,
  .archive .pub__authors, .archive .pub__venue,
  .page__content .pub__authors, .page__content .pub__venue {
    margin: 0 0 2px;
    font-size: 0.875rem;
    line-height: 1.5;
    color: var(--secondary);
  }
  .pub__authors strong { color: var(--text); font-weight: 700; }
  .page__content .pub__links, .archive .pub__links {
    display: flex;
    flex-wrap: wrap;
    gap: 5.6px;
    margin: 6px 0 0;
  }
  a.pub-link, a.pub-link:visited {
    display: inline-block;
    padding: 2.4px 8px;
    border: 1px solid var(--button-edge);
    border-radius: 3px;
    font-family: var(--sans);
    font-size: 0.8rem;
    line-height: 1.4;
    color: var(--text);
  }
  a.pub-link:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }
  .publication-category {
    margin: 32px 0 4px !important;
    padding-bottom: 4px !important;
    border-bottom: 1px solid var(--rule) !important;
    font-size: 1.25rem !important;
    font-weight: 600;
    color: var(--footer) !important;
  }

  /* ── Talks ─────────────────────────────── */
  .talk {
    display: flex;
    gap: 16px;
    padding: 9.6px 0;
    border-bottom: 1px solid var(--row-rule);
  }
  .talk__date {
    flex: none;
    width: 80px;
    padding-top: 3px;
    font-family: var(--sans);
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--accent);
  }
  .talk__body { min-width: 0; }
  .archive .talk__title {
    margin: 0 0 2px;
    font-family: var(--serif);
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.4;
  }
  .archive .talk__meta, .archive .talk__excerpt p {
    margin: 0 0 2px;
    font-size: 0.875rem;
    line-height: 1.5;
    color: var(--secondary);
  }
  .talk__type { color: var(--text); }
  .talk__ext { font-size: 0.8rem; }

  /* ── Generic archive rows (teaching, sitemap) ── */
  .archive .list__item .archive__item {
    padding: 9.6px 0;
    border-bottom: 1px solid var(--row-rule);
  }
  .archive .archive__item-title {
    margin: 0 0 2px;
    padding: 0;
    border: 0;
    font-family: var(--serif);
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.4;
    text-transform: none;
  }
  .archive .archive__item p {
    margin: 0 0 2px;
    font-size: 0.875rem;
    line-height: 1.5;
    color: var(--secondary);
  }
  .archive .archive__item-excerpt { margin-top: 0; }
  li.list__item { display: block; }

  /* ── Education and teaching entries ──────── */
  .cv-entries { margin-bottom: 16px; }
  .cv-entry { padding: 9.6px 0; border-bottom: 1px solid var(--row-rule); }
  .cv-entry__heading {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 2px 16px;
  }
  .page__content .cv-entry__heading h3 { flex: 1 1 18rem; margin: 0; font-family: var(--serif); font-size: 1rem; font-weight: 600; }
  .cv-entry__date { font-family: var(--sans); font-size: 0.8rem; font-weight: 600; color: var(--accent); white-space: nowrap; }
  .page__content .cv-entry > p { margin: 2px 0; font-size: 0.875rem; color: var(--secondary); }
  .cv-entry details { margin-top: 2px; }
  .page__content .cv-entry details li { font-size: 0.875rem; line-height: 1.5; }

  /* ── Detail pages ───────────────────────── */
  .page__content p[style*="smaller"] { font-size: 0.875rem !important; color: var(--secondary); }
  .page__meta { font-family: var(--sans); font-size: 0.875rem; color: var(--secondary); }
  .page__date, .archive .archive__item p.page__date { font-family: var(--sans); font-size: 0.8rem; font-weight: 600; color: var(--accent); }
  .page__content .cv-list, .archive .cv-list { margin: 0 0 16px; padding: 0; list-style: none; }
  .page__taxonomy i, .page__meta-title { display: none; }
  .page__taxonomy strong { font-weight: 400; }
  .page__taxonomy .page__taxonomy-item, .page__taxonomy .page__taxonomy-item:visited {
    margin: 0; padding: 0; border: 0; background: none; font-size: 0.875rem; color: var(--secondary);
  }
  .page__share { margin-top: 24px; padding-top: 12px; border-top: 1px solid var(--row-rule); }
  .page__share-title { margin-bottom: 6px; font-size: 0.875rem; font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--text); }
  .page__share .btn { margin: 0 4px 4px 0; padding: 6px 10px; border: 1px solid var(--button-edge) !important; }
  .pagination--pager, .pagination--pager:visited {
    border: 1px solid var(--button-edge) !important; border-radius: 3px; background: transparent !important;
    font-family: var(--sans); font-size: 0.875rem; font-weight: 400; color: var(--text) !important;
  }
  .pagination--pager:hover { border-color: var(--accent) !important; color: var(--accent) !important; text-decoration: none; }
  .pagination--pager.disabled { color: var(--button-edge) !important; }
  .btn, .btn:visited {
    padding: 2.4px 8px;
    border: 1px solid var(--button-edge);
    border-radius: 3px;
    background: transparent;
    box-shadow: none;
    font-family: var(--sans);
    font-size: 0.8rem;
    font-weight: 400;
    color: var(--text) !important;
  }
  .btn:hover { border-color: var(--accent); background: transparent; color: var(--accent) !important; text-decoration: none; }
  .pagination--pager, .page__share, .page__related { font-family: var(--sans); }

  /* ── Footer ────────────────────────────── */
  .page__footer {
    margin-top: 48px;
    border-top: 1px solid var(--rule);
    background: #ffffff;
    color: var(--footer);
  }
  .page__footer footer { padding-top: 32px; padding-bottom: 32px; text-align: center; }
  .page__footer-copyright { font-family: var(--serif); font-size: 0.875rem; line-height: 1.65; color: var(--footer); }
  .page__footer a, .page__footer a:visited { color: var(--secondary); }
  .page__footer a:hover { color: var(--accent); }

  /* ── Narrow screens ─────────────────────── */
  @media (max-width: 576px) {
    .profile { flex-direction: column; align-items: center; text-align: center; }
    .profile__photo { width: 160px; height: 160px; }
    .profile__icons { justify-content: center; }
    .pub { flex-direction: column; align-items: flex-start; gap: 10px; }
    .pub__thumb img { width: 100%; max-width: 360px; height: auto; aspect-ratio: 16 / 9; }
    .site-nav { gap: 0 12px; }
    .site-nav a { padding: 6px 0; }
    .talk { gap: 12px; }
    .talk__date { width: 64px; }
  }
</style>
