<!-- favicon: "DH" monogram drawn from plain geometry in images/favicon.svg

<!-- Browser UI colour = page background (--bg) of each theme. The media
     queries follow the system; the script makes an explicit choice from the
     header toggle (data-theme on <html>) win, now and whenever it changes. -->
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)"/>
<script>(function(){var r=document.documentElement,m=document.querySelectorAll('meta[name="theme-color"]');function sync(){var t=r.getAttribute('data-theme');for(var i=0;i<m.length;i++){if(!m[i].hasAttribute('data-system')){m[i].setAttribute('data-system',m[i].getAttribute('content'));}m[i].setAttribute('content',t==='dark'?'#0b0b0c':t==='light'?'#ffffff':m[i].getAttribute('data-system'));}}sync();if(window.MutationObserver){new MutationObserver(sync).observe(r,{attributes:true,attributeFilter:['data-theme']});}})();</script>
<meta name="color-scheme" content="light dark"/>
