{% include base_path %}
<header class="site-header">
  <div class="site-header__inner">
    <a class="site-title" href="{{ base_path }}/">{{ site.masthead_title | default: site.title }}</a>
    <nav class="site-nav" aria-label="Main">
      <a href="{{ base_path }}/"{% if page.url == '/' or page.url == '/index.html' %} class="is-active" aria-current="page"{% endif %}>About</a>
      {% for link in site.data.navigation.main %}
        {% if link.url contains 'http' %}
          {% assign domain = '' %}
        {% else %}
          {% assign domain = base_path %}
        {% endif %}
        <a href="{{ domain }}{{ link.url }}"{% if page.url contains link.url and link.url != '/' %} class="is-active" aria-current="page"{% endif %}>{{ link.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
