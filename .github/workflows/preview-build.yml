# Build a non-master branch with the same builder GitHub Pages uses and keep
# the generated site as a downloadable artifact, so a redesign can be checked
# before it is merged. Master is built and served by GitHub Pages itself.
name: Preview build

on:
  push:
    branches-ignore: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 7
