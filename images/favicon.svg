<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>DH</title>
  <!-- "DH" monogram drawn from plain geometry (no fonts), on a 32-unit grid
       so it stays crisp at 16px and 32px. -->
  <rect width="32" height="32" rx="7" fill="#0f172a"/>
  <!-- D: stem plus a half-ellipse bowl; H: two stems and a crossbar -->
  <path fill="#ffffff" fill-rule="evenodd"
        d="M4 6H8A7 8 0 0 1 8 22H4Z M8 10V18A3 4 0 0 0 8 10Z
           M17 6h4v6h3V6h4V22h-4v-6h-3V22h-4Z"/>
  <rect x="4" y="24" width="24" height="2" rx="1" fill="#5eead4"/>
</svg>
