- date: 2026-08
  text: >-
    New preprint on arXiv, [Control-Diverse Reinforcement Fine-Tuning](/publication/2026-arxiv-cd-rft).
    RL post-training concentrates *control* on a shared set of components across tasks, even where
    activations look diverse — and relieving that bottleneck improves multi-task performance.

