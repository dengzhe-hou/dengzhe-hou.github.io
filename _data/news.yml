- date: 2026-08
  text: >-
    Awarded [**KAKENHI Grant-in-Aid for Research Activity Start-up**](https://kaken.nii.ac.jp/ja/grant/KAKENHI-PROJECT-26K25566/)
    (PI, 26K25566): the representational format of attentional templates, probed with computational
    model hierarchies, EEG and eye tracking.

